name: Node.js CI - Hello World

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  ci: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello from CI Pipeline 🚀"		

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run app
        run: npm start
