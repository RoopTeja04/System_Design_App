name: Final Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  client-ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]   

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            client/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - run: npm install
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm run format:check
        working-directory: client

      - run: npm run build
        working-directory: client

  auth-ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20] 

    env:
      MONGO_URL: ${{ secrets.MONGO_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            Authentication/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('Authentication/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - run: npm install
        working-directory: Authentication

      - run: npm run lint
        working-directory: Authentication

      - run: npm run format:check
        working-directory: Authentication

      - run: npm test
        working-directory: Authentication

  feed-ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20] 

    env:
      MONGO_URL: ${{ secrets.MONGO_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            Feed/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('Feed/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - run: npm install
        working-directory: Feed

      - run: npm run lint
        working-directory: Feed

      - run: npm run format:check
        working-directory: Feed

      - run: npm test || echo "No tests"
        working-directory: Feed

  profile-ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20] 

    env:
      MONGO_URL: ${{ secrets.MONGO_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            Profile/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('Profile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - run: npm install
        working-directory: Profile

      - run: npm run lint
        working-directory: Profile

      - run: npm run format:check
        working-directory: Profile

      - run: npm test || echo "No tests"
        working-directory: Profile
