name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  client-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run format:check
        working-directory: client
      - run: npm run build
        working-directory: client

  auth-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
        working-directory: Authentication
      - run: npm run lint
        working-directory: Authentication
      - run: npm run format:check
        working-directory: Authentication
      - run: npm test
        working-directory: Authentication

  feed-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
        working-directory: Feed
      - run: npm run lint
        working-directory: Feed
      - run: npm run format:check
        working-directory: Feed
      - run: npm test || echo "No tests"
        working-directory: Feed

  profile-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
        working-directory: Profile
      - run: npm run lint
        working-directory: Profile
      - run: npm run format:check
        working-directory: Profile
      - run: npm test || echo "No tests"
        working-directory: Profile
